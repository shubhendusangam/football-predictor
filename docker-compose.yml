# ============================================
# Docker Compose for Football Match Predictor
# ============================================
# This compose file runs both services:
# 1. football-predictor (port 8080) - Main prediction API
# 2. model-training-service (port 8081) - Model training and testing API
# 3. prometheus (port 9090) - Metrics collection
# 4. grafana (port 3000) - Metrics dashboards
# ============================================

version: '3.8'

services:
  # Main Football Prediction Application
  football-predictor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: football-prediction-app
    container_name: football-predictor
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
      - SPRING_PROFILES_ACTIVE=docker
      # Football Data API key (replace with your own)
      - FOOTBALL_API_KEY=${FOOTBALL_API_KEY:-your_api_key_here}
    volumes:
      # Persist H2 database and trained model
      - football-data:/app/data
      - football-logs:/app/logs
    restart: unless-stopped
    depends_on:
      - model-training-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/model/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - football-network

  # Model Training Service
  model-training-service:
    build:
      context: .
      dockerfile: model-training-service/Dockerfile.multi-stage
      args:
        MODULE_NAME: model-training-service
    container_name: model-training-service
    ports:
      - "8081:8081"
    environment:
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      # Share database and model storage with main app
      - football-data:/app/data
      - football-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/training/model-info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - football-network

  # ── Observability Stack ─────────────────────────────────────

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: football-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - football-network

  # Grafana - Dashboards & Visualization
  grafana:
    image: grafana/grafana:10.4.1
    container_name: football-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-football}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - football-network

volumes:
  football-data:
    name: football-predictor-data
  football-logs:
    name: football-predictor-logs
  prometheus-data:
    name: football-prometheus-data
  grafana-data:
    name: football-grafana-data

networks:
  football-network:
    driver: bridge

