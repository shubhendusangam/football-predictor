spring.application.name=football-prediction
football.api.key=${FOOTBALL_API_KEY:your_api_key_here}
football.api.base-url=https://api.football-data.org/v4
# Competition codes: PL=Premier League, PD=La Liga, BL1=Bundesliga
football.api.competition=PL
# Fetch new results daily at 6am
football.fetch.cron=0 0 6 * * *

# ?????????????????????????????????????????
#  News (Free RSS Feeds - no API key required!)
#  Sources: BBC Sport, Sky Sports, ESPN, The Guardian
# ?????????????????????????????????????????
# No configuration needed - uses free RSS feeds automatically

# ?????????????????????????????????????????
#  Server
# ?????????????????????????????????????????
server.port=8080

# Allow encoded slashes in URLs (needed for season IDs like "2025/26")
server.tomcat.relaxed-path-chars=|,{,},[,]
server.tomcat.relaxed-query-chars=|,{,},[,]

# ?????????????????????????????????????????
#  H2 Embedded Database
# ?????????????????????????????????????????
spring.datasource.url=jdbc:h2:file:./data/footballdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ?????????????????????????????????????????
#  Flyway Database Migrations
#  SQL files in: src/main/resources/db/migration/
#  Naming: V1__description.sql, V2__description.sql
# ?????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true

# ???????????????????????????????????????????????????????????????????????????
#  CSV File Paths
#  Place downloaded CSVs in src/main/resources/data/
#  Premier League data from 1993/94 to 2025/26 (33 seasons)
# ???????????????????????????????????????????????????????????????????????????
csv.data.paths=data/PL_93_94.csv,data/PL_94_95.csv,data/PL_95_96.csv,data/PL_96_97.csv,\
data/PL_97_98.csv,data/PL_98_99.csv,data/PL_99_00.csv,data/PL_00_01.csv,\
data/PL_01_02.csv,data/PL_02_03.csv,data/PL_03_04.csv,data/PL_04_05.csv,\
data/PL_05_06.csv,data/PL_06_07.csv,data/PL_07_08.csv,data/PL_08_09.csv,\
data/PL_09_10.csv,data/PL_10_11.csv,data/PL_11_12.csv,data/PL_12_13.csv,\
data/PL_13_14.csv,data/PL_14_15.csv,data/PL_15_16.csv,data/PL_16_17.csv,\
data/PL_17_18.csv,data/PL_18_19.csv,data/PL_19_20.csv,data/PL_20_21.csv,\
data/PL_21_22.csv,data/PL_22_23.csv,data/PL_23_24.csv,data/PL_24_25.csv,\
data/PL_25_26.csv

# ???????????????????????????????????????????????????????????????????????????
#  Weka Model
# ???????????????????????????????????????????????????????????????????????????
model.output.path=./data/match_predictor.model
model.ensemble.path=./data/ensemble_model.model
model.backup.path=./data/model_backups

# Poisson Score Model (Dixon-Coles) - shared with model-training-service
model.poisson.output.path=./data/poisson_score.model
model.poisson.max-goals=5

# Model type: RANDOM_FOREST, GRADIENT_BOOSTING, ENSEMBLE, STACKED_ENSEMBLE
model.type=STACKED_ENSEMBLE

# Stacked Ensemble: RandomForest + Gradient Boosting + Logistic Regression meta-model
model.stacked.ensemble.enabled=true

# Cross-validation settings
model.crossvalidation.enabled=true
model.crossvalidation.folds=10

# SMOTE class balancing (improves Draw prediction)
model.smote.enabled=true
model.smote.percentage=100

# Draw prediction threshold boost (0.0 = no boost, 0.05 = slight draw preference)
# When draw probability + threshold >= max(home, away), predict Draw
model.draw.threshold=0.05

# ???????????????????????????????????????????????????????????????????????????
#  Feature Engineering
# ???????????????????????????????????????????????????????????????????????????
feature.form.window=5

# ?????????????????????????????????????????
#  CORS Configuration
# ?????????????????????????????????????????
# Comma-separated list of allowed origins for cross-origin API requests.
# Add your frontend deployment URL(s) here.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
cors.max-age-seconds=3600

# ?????????????????????????????????????????
#  Rate Limiting
# ?????????????????????????????????????????
ratelimit.enabled=true
# Default API rate limit (requests per minute per IP)
ratelimit.requests-per-minute=120
# Lower limit for expensive prediction endpoints
ratelimit.prediction.requests-per-minute=30
# Lower limit for admin/training endpoints
ratelimit.admin.requests-per-minute=20
# Burst capacity multiplier (1.5 = allow 50% burst above sustained rate)
ratelimit.burst-capacity-multiplier=1.5

# ?????????????????????????????????????????
#  Security Headers
# ?????????????????????????????????????????
# HSTS: Enable only in production behind HTTPS (breaks HTTP-only dev setups)
security.hsts.enabled=${SECURITY_HSTS_ENABLED:false}
# Content-Security-Policy: Restricts browser resource loading
security.csp.enabled=true

# ?????????????????????????????????????????
#  Scheduler (Auto-update from football-data.co.uk)
# ?????????????????????????????????????????
scheduler.enabled=true
scheduler.auto-retrain=true
# Run every Monday and Friday at 6 AM (football-data.co.uk updates twice weekly)
scheduler.cron=0 0 6 * * MON,FRI

# ?????????????????????????????????????????
#  Admin Authentication
# ?????????????????????????????????????????
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:changeme}

# ?????????????????????????????????????????
#  Cache Configuration (Optimized)
# ?????????????????????????????????????????

# Standings cache - updates rarely, cache longer (30 min)
cache.standings.ttl=1800
cache.standings.maxSize=100

# Team logos cache - logos stored in DB, very long TTL (24 hours)
# Logos only change once per season, so cache aggressively
cache.teamLogos.ttl=86400
cache.teamLogos.maxSize=200

# Matches cache - for upcoming/scheduled matches (5 min for more real-time updates)
# Use ?refresh=true parameter to bypass cache entirely
cache.matches.ttl=300
cache.matches.maxSize=500

# News cache - updates periodically (30 min)
cache.news.ttl=1800
cache.news.maxSize=200

# Predictions cache - frequently accessed, shorter TTL (5 min)
cache.predictions.ttl=300
cache.predictions.maxSize=1000

# Team stats cache - stable data, cache longer (30 min)
cache.teamStats.ttl=1800
cache.teamStats.maxSize=200

# H2H insights cache - historical data, cache longer (60 min)
cache.h2h.ttl=3600
cache.h2h.maxSize=300

# Trending insights cache - moderate TTL (10 min)
cache.trending.ttl=600
cache.trending.maxSize=100

# Goals trends cache - longer TTL (30 min, historical data changes infrequently)
cache.goalsTrends.ttl=1800
cache.goalsTrends.maxSize=50

# API responses cache - external API calls (15 min)
cache.api.ttl=900
cache.api.maxSize=200

# API sync cache - sync status, short TTL (1 min)
cache.apiSync.ttl=60
cache.apiSync.maxSize=10

# Cache warmup configuration
cache.warmup.enabled=true
cache.warmup.delay=30000

# Expected Goals cache - xG team stats (15 min)
cache.expectedGoals.ttl=900
cache.expectedGoals.maxSize=100

# xG Prediction cache - match xG predictions (10 min)
cache.xgPrediction.ttl=600
cache.xgPrediction.maxSize=200

# Referee stats cache - individual referee stats (15 min)
cache.refereeStats.ttl=900
cache.refereeStats.maxSize=100

# All referees cache - complete referee list (1 hour, rarely changes)
cache.allReferees.ttl=3600
cache.allReferees.maxSize=10

# All referee stats cache - aggregated referee stats (30 min)
cache.allRefereeStats.ttl=1800
cache.allRefereeStats.maxSize=10

# Injury cache configuration (Caffeine)
cache.injuryAvailability.ttl=21600
cache.injuryAvailability.maxSize=100
cache.injuryRaw.ttl=43200
cache.injuryRaw.maxSize=50

# ?????????????????????????????????????????
#  Spring Boot Actuator & Prometheus Metrics
# ?????????????????????????????????????????
management.endpoints.web.exposure.include=health,info,metrics,prometheus,flyway,loggers
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.loggers.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.prediction.latency=0.5,0.95,0.99
management.metrics.distribution.sla.prediction.latency=100ms,200ms,500ms,1s

# ?????????????????????????????????????????
#  Logging Configuration - Clean Startup
# ?????????????????????????????????????????

logging.config=classpath:logback-spring.xml

# Disable Spring Boot banner for cleaner console
spring.main.banner-mode=off

# Disable JPA open-in-view warning
spring.jpa.open-in-view=false

# ?????????????????????????????????????????????
#  Hibernate JDBC Batching (backfill performance)
#  Groups INSERT/UPDATE statements into batches
#  instead of executing one at a time
# ?????????????????????????????????????????????
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Reduce startup logging noise
logging.level.root=WARN
logging.level.com.app.footballprediction=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache=WARN

# ???????????????????????????????????????????????????????????????
# Enterprise Ingestion Pipeline Feature Flags
# ???????????????????????????????????????????????????????????????
# These flags control the gradual migration from legacy to new pipeline.
# Default: Legacy pipeline enabled, new pipeline disabled.

# Master switch: Use legacy pipeline (CsvIngestionService, FootballDataApiService)
feature.ingestion.use.legacy.pipeline=true

# Enable new provider-based ingestion pipeline
feature.ingestion.use.new.pipeline=false

# Shadow validation: Run both pipelines, compare results, log differences
feature.ingestion.shadow.validation=false

# Shadow only: Run new pipeline but don't write to database
feature.ingestion.shadow.only=false

# Enable event publishing for match updates (triggers stats refresh, cache invalidation)
feature.ingestion.events.enabled=false

# Enable parallel comparison mode (run both pipelines)
feature.ingestion.parallel.comparison=false

# Enable data drift detection
feature.ingestion.drift.detection=true

# Enable detailed ingestion logging
feature.ingestion.detailed.logging=false

# ???????????????????????????????????????????????????????????????
# Daily Match Polling Configuration
# ???????????????????????????????????????????????????????????????
# Automated daily polling for completed matches and smart retraining

# Enable/disable daily polling
polling.enabled=true

# Cron expression for daily polling (default: 2:00 AM daily)
polling.cron=0 0 2 * * *

# Competition to poll (PL=Premier League)
polling.competition=PL

# Days to look back when polling
polling.days.lookback=7

# Enable/disable smart model retraining
polling.retrain.enabled=true

# ???????????????????????????????????????????????????????????????
# Smart Retrain Configuration
# ???????????????????????????????????????????????????????????????

# Minimum new matches required to trigger retrain
retrain.min.new.matches=5

# Cooldown period between retrains (hours)
retrain.cooldown.hours=24

# ???????????????????????????????????????????????????????????????
# Daily Prediction Generation
# ???????????????????????????????????????????????????????????????
# Auto-generates predictions for all upcoming scheduled matches.
# Ensures the dashboard "Today's Predictions" widget always has data.

# Enable/disable automatic prediction generation
prediction.scheduler.enabled=true

# Cron expression (default: 7:00 AM daily)
prediction.scheduler.cron=0 0 7 * * *

# ???????????????????????????????????????????????????????????????
# API Data Sync Configuration
# ???????????????????????????????????????????????????????????????
# Synchronizes data from football-data.org API to local database
# Ensures UI displays fresh data instead of stale CSV data

# Enable/disable API data sync
api.sync.enabled=true

# Competition to sync (PL=Premier League)
api.sync.competition=PL

# Scheduler: Hourly API sync (every hour at minute 0)
scheduler.api-sync.enabled=true
scheduler.api-sync.cron=0 0 * * * *

# Scheduler: Post-match sync (18:00, 20:00, 22:00 GMT)
# Most Premier League matches finish around these times
scheduler.post-match.enabled=true
scheduler.post-match.cron=0 0 18,20,22 * * *

# ============================================================================
# STARTUP DATA SYNC CONFIGURATION
# ============================================================================
# Automatically checks data freshness on application startup
# and syncs if data is stale (e.g., after app was offline for days)

# Enable/disable automatic sync on startup
startup.sync.enabled=true

# Threshold: sync if data is older than X days
# Set to 0 to sync on every restart
# Set to 7 to only sync if offline for a week
startup.sync.threshold-days=1

# Competition to sync on startup (PL = Premier League)
startup.sync.competition=PL

# Sync mode:
#   smart = Only sync missing data (faster, recommended)
#   full  = Sync everything from scratch (slower, more thorough)
startup.sync.mode=smart

# ???????????????????????????????????????????????????????????????
# Post-Match Recalculation Engine
# ???????????????????????????????????????????????????????????????
# Smart event-driven recalculation:
#   - Checks DB for newly finished matches (NOT blind 15-min polling)
#   - Triggers recalculation pipeline in background only when new data exists
#   - Updates/retrains model only when no live matches remain

# Master switch
recalculation.scheduler.enabled=true

# Match-day window check (every 30 min, 18:00?23:59)
# Most PL matches finish between 17:00 and 22:00 GMT
recalculation.matchday.cron=0 0/30 18-23 * * *

# Overnight catch-up (02:00 AM daily)
# Picks up late results, overnight syncs, and triggers model update
recalculation.overnight.cron=0 0 2 * * *

# Model self-training thresholds (adjustable)
# If winnerAccuracy drops below this, increase teamFormScore weight
retrain.threshold.winner-accuracy=0.65
# If goalErrorAverage exceeds this, increase attackingStrength weight
retrain.threshold.goal-error=1.2
# If cardErrorAverage exceeds this, increase refereeImpact weight
retrain.threshold.card-error=2.0
# If cornerErrorAverage exceeds this, increase cornerStrategy weight
retrain.threshold.corner-error=3.0

# ?????????????????????????????????????????
#  Springdoc OpenAPI / Swagger UI
# ?????????????????????????????????????????
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
springdoc.show-actuator=false

# ?????????????????????????????????????????
#  Player Availability (Phase 10)
# ?????????????????????????????????????????
# Enable/disable the daily player availability sync
player.availability.scheduler.enabled=${PLAYER_AVAILABILITY_ENABLED:true}
# Cron expression for daily sync (default: 10:00 AM)
player.availability.sync.cron=0 0 10 * * *

# ?????????????????????????????????????????????????????????
#  API-Football Config (Injury Data Integration)
# ?????????????????????????????????????????????????????????
apifootball.api.key=${APIFOOTBALL_API_KEY:your_api_key_here}
apifootball.api.base-url=https://v3.football.api-sports.io
apifootball.api.daily-limit=100
apifootball.api.budget.injury=20
apifootball.api.budget.fixtures=5
apifootball.api.budget.reserve=27
apifootball.api.premier-league-id=39
apifootball.api.current-season=2025
apifootball.api.enabled=true
