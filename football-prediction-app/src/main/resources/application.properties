spring.application.name=football-prediction
football.api.key=${FOOTBALL_API_KEY:your_api_key_here}
football.api.base-url=https://api.football-data.org/v4
football.api.competition=PL   # PL=Premier League, PD=La Liga, BL1=Bundesliga
football.fetch.cron=0 0 6 * * *   # Fetch new results daily at 6am

# ?????????????????????????????????????????
#  News (Free RSS Feeds - no API key required!)
#  Sources: BBC Sport, Sky Sports, ESPN, The Guardian
# ?????????????????????????????????????????
# No configuration needed - uses free RSS feeds automatically

# ?????????????????????????????????????????
#  Server
# ?????????????????????????????????????????
server.port=8080

# ?????????????????????????????????????????
#  H2 Embedded Database
# ?????????????????????????????????????????
spring.datasource.url=jdbc:h2:file:./data/footballdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ?????????????????????????????????????????
#  CSV File Paths
#  Place downloaded CSVs in src/main/resources/data/
#  Premier League data from 2004/05 to 2025/26 (22 seasons)
# ?????????????????????????????????????????
csv.data.paths=data/PL_04_05.csv,data/PL_05_06.csv,data/PL_06_07.csv,data/PL_07_08.csv,\
data/PL_08_09.csv,data/PL_09_10.csv,data/PL_10_11.csv,data/PL_11_12.csv,\
data/PL_12_13.csv,data/PL_13_14.csv,data/PL_14_15.csv,data/PL_15_16.csv,\
data/PL_16_17.csv,data/PL_17_18.csv,data/PL_18_19.csv,data/PL_19_20.csv,\
data/PL_20_21.csv,data/PL_21_22.csv,data/PL_22_23.csv,data/PL_23_24.csv,\
data/PL_24_25.csv,data/PL_25_26.csv

# ???????????????????????????????????????????????????????????????????????????
#  Weka Model
# ???????????????????????????????????????????????????????????????????????????
model.output.path=./data/match_predictor.model
model.ensemble.path=./data/ensemble_model.model

# Model type: RANDOM_FOREST, GRADIENT_BOOSTING, ENSEMBLE, STACKED_ENSEMBLE
model.type=STACKED_ENSEMBLE

# Stacked Ensemble: RandomForest + Gradient Boosting + Logistic Regression meta-model
model.stacked.ensemble.enabled=true

# Cross-validation settings
model.crossvalidation.enabled=true
model.crossvalidation.folds=10

# ???????????????????????????????????????????????????????????????????????????
#  Feature Engineering
# ???????????????????????????????????????????????????????????????????????????
feature.form.window=5

# ?????????????????????????????????????????
#  Scheduler (Auto-update from football-data.co.uk)
# ?????????????????????????????????????????
scheduler.enabled=true
scheduler.auto-retrain=true
# Run every Monday and Friday at 6 AM (football-data.co.uk updates twice weekly)
scheduler.cron=0 0 6 * * MON,FRI

# ?????????????????????????????????????????
#  Cache Configuration (TTL in seconds)
# ?????????????????????????????????????????
cache.standings.ttl=300
cache.matches.ttl=300
cache.news.ttl=900
cache.predictions.ttl=60

# ?????????????????????????????????????????
#  Admin Authentication
# ?????????????????????????????????????????
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# Logging
logging.config=classpath:log4j2.xml

# Set to DEBUG to see feature computation per match
logging.level.com.football.predictor.service.FeatureEngineeringService=INFO

# Set to DEBUG to see every Hibernate SQL query
logging.level.org.hibernate.SQL=WARN