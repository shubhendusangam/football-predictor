<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Football Forecaster - AI-powered match predictions and analytics">
    <title>Football Forecaster - Dashboard</title>

    <!-- Favicon -->
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/logo.svg">

    <link rel="stylesheet" href="css/layout.css?v=3">
    <link rel="stylesheet" href="css/dashboard.css?v=2">
    <link rel="stylesheet" href="css/upcoming-matches.css?v=2">
    <link rel="stylesheet" href="css/historical.css?v=2">
    <link rel="stylesheet" href="css/team-logo.css?v=2">
    <link rel="stylesheet" href="css/team-analytics.css?v=1">
    <link rel="stylesheet" href="css/admin.css?v=1">
    <link rel="stylesheet" href="css/pre-match-insights.css?v=1">
    <link rel="stylesheet" href="css/league-standings.css?v=1">
    <link rel="stylesheet" href="css/system-status.css?v=1">
    <link rel="stylesheet" href="css/shot-quality-card.css?v=1">
    <link rel="stylesheet" href="css/fouls-analysis-card.css?v=1">
    <link rel="stylesheet" href="css/half-analysis.css?v=1">
    <link rel="stylesheet" href="css/expected-goals-card.css?v=1">
    <link rel="stylesheet" href="css/cards.css?v=1">
    <link rel="stylesheet" href="css/kickoff-time-card.css?v=1">
    <link rel="stylesheet" href="css/fixture-congestion-card.css?v=1">

    <!-- Preload critical resources -->
    <link rel="preload" href="js/ui-utils.js?v=3" as="script">
    <link rel="preload" href="js/layout.js?v=3" as="script">
</head>
<body>
    <!-- Top Loading Bar -->
    <div id="topLoadingBar" class="top-loading-bar hidden"></div>

    <!-- Top Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <img src="images/logo.svg" alt="Football Forecaster Logo" class="brand-logo">
                <h1 class="brand-name">Football Forecaster</h1>
            </div>
            <ul class="navbar-links">
                <li><a href="#dashboard" class="nav-link active">Dashboard</a></li>
                <li><a href="#predictions" class="nav-link">Predictions</a></li>
                <li><a href="#historical" class="nav-link">Historical</a></li>
                <li><a href="#insights" class="nav-link">Insights</a></li>
                <li><a href="#admin" class="nav-link nav-link-admin" id="adminNavLink">🔐 Admin</a></li>
            </ul>
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <span class="toggle-icon">☰</span>
            </button>
        </div>
    </nav>

    <div class="app-container">
        <!-- Collapsible Sidebar -->
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <a href="#dashboard" class="sidebar-link active">
                    <span class="sidebar-icon">📊</span>
                    <span class="sidebar-label">Dashboard</span>
                </a>
                <a href="#predictions" class="sidebar-link">
                    <span class="sidebar-icon">🎯</span>
                    <span class="sidebar-label">Predictions</span>
                </a>
                <a href="#historical" class="sidebar-link">
                    <span class="sidebar-icon">📈</span>
                    <span class="sidebar-label">Historical Data</span>
                </a>
                <a href="#insights" class="sidebar-link">
                    <span class="sidebar-icon">💡</span>
                    <span class="sidebar-label">Insights</span>
                </a>
                <a href="#teams" class="sidebar-link">
                    <span class="sidebar-icon">🏆</span>
                    <span class="sidebar-label">Teams</span>
                </a>
                <a href="#matches" class="sidebar-link">
                    <span class="sidebar-icon">⚽</span>
                    <span class="sidebar-label">Matches</span>
                </a>
                <a href="#admin" class="sidebar-link sidebar-link-admin" id="adminSidebarLink">
                    <span class="sidebar-icon">🔐</span>
                    <span class="sidebar-label">Admin</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" id="mainContent">
            <div class="content-header">
                <h2 class="page-title">Dashboard</h2>
                <p class="page-description">Overview of match predictions and team statistics</p>
            </div>

            <!-- Dashboard Container - Will be populated by dashboard-v2.js -->
            <div class="dashboard-container" id="dashboardContainer">
                <!-- Row 1: Upcoming Matches + Combined League Table with UCL Race (50/50) -->
                <div class="dashboard-row-1">
                    <div class="dashboard-card" id="upcomingMatchesCard">
                        <div class="dashboard-card-loading">
                            <div class="dashboard-skeleton title"></div>
                            <div class="dashboard-skeleton card"></div>
                            <div class="dashboard-skeleton card"></div>
                        </div>
                    </div>
                    <div class="dashboard-card dashboard-card-featured" id="leagueStandingsCard">
                        <div class="dashboard-card-loading">
                            <div class="dashboard-skeleton title"></div>
                            <div class="dashboard-skeleton card"></div>
                            <div class="dashboard-skeleton card"></div>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Today's Predictions + Top Teams + Model Accuracy (33/33/33) -->
                <div class="dashboard-row-2">
                    <div class="dashboard-card" id="todaysPredictionsCard">
                        <div class="dashboard-card-loading">
                            <div class="dashboard-skeleton title"></div>
                            <div class="dashboard-skeleton card"></div>
                        </div>
                    </div>
                    <div class="dashboard-card" id="topTeamsCard">
                        <div class="dashboard-card-loading">
                            <div class="dashboard-skeleton title"></div>
                            <div class="dashboard-skeleton card"></div>
                        </div>
                    </div>
                    <div class="dashboard-card" id="modelAccuracyCard">
                        <div class="dashboard-card-loading">
                            <div class="dashboard-skeleton title"></div>
                            <div class="dashboard-skeleton card"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js?v=3"></script>
    <script src="js/team-logos.js?v=4"></script>
    <script src="js/ui-utils.js?v=3"></script>
    <script src="js/api-client.js?v=3"></script>
    <script src="js/shot-quality-card.js?v=1"></script>
    <script src="js/corner-stats-card.js?v=1"></script>
    <script src="js/cards-prediction-card.js?v=1"></script>
    <script src="js/team-discipline-card.js?v=1"></script>
    <script src="js/half-analysis-card.js?v=1"></script>
    <script src="js/expected-goals-card.js?v=1"></script>
    <script src="js/kickoff-time-card.js?v=1"></script>
    <script src="js/fixture-congestion-card.js?v=1"></script>
    <script src="js/half-comparison-widget.js?v=1"></script>
    <script src="js/layout.js?v=3"></script>
    <script src="js/router.js?v=3"></script>
    <script src="js/upcoming-matches.js?v=3"></script>
    <script src="js/dashboard-v2.js?v=5"></script>
    <script src="js/historical.js?v=3"></script>
    <script src="js/league-standings.js?v=1"></script>
    <script src="js/admin.js?v=1"></script>
    <script src="js/system-status.js?v=1"></script>
</body>
</html>
