# ============================================
# Docker Profile Configuration for Model Training Service
# ============================================

spring.application.name=model-training-service

# ============================================================================
# Server Configuration
# ============================================================================
server.port=8081

# ============================================================================
# H2 Database (same database as main app - shared volume in Docker)
# ============================================================================
spring.datasource.url=jdbc:h2:file:/app/data/footballdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Disable H2 console in Docker (security)
spring.h2.console.enabled=false

# ============================================================================
# Model Storage Configuration (Docker volumes)
# ============================================================================
model.output.path=/app/data/match_predictor.model
model.ensemble.path=/app/data/ensemble_model.model
model.backup.path=/app/data/model_backups/

# ============================================================================
# Model Training Configuration
# ============================================================================
model.type=RANDOM_FOREST
model.stacked.ensemble.enabled=true

# Cross-validation settings
model.crossvalidation.enabled=true
model.crossvalidation.folds=10

# Training parameters
model.training.min-matches=100
model.training.train-split=0.8

# ============================================================================
# Feature Engineering
# ============================================================================
feature.form.window=5

# ============================================================================
# Scheduled Training (enabled in Docker)
# ============================================================================
scheduler.enabled=true
scheduler.auto-retrain=true

