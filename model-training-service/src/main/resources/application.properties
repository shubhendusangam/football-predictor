spring.application.name=model-training-service

# ============================================================================
# Server Configuration
# ============================================================================
server.port=8081

# ============================================================================
# H2 Database (same database as main app for reading match data)
# ============================================================================
spring.datasource.url=jdbc:h2:file:../data/footballdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================================
# Model Storage Configuration
# Model will be stored in the main project's data folder
# ============================================================================
model.output.path=../data/match_predictor.model
model.ensemble.path=../data/ensemble_model.model
model.backup.path=../data/model_backups/

# ============================================================================
# Model Training Configuration
# ============================================================================
# Model type: RANDOM_FOREST, GRADIENT_BOOSTING, ENSEMBLE
model.type=RANDOM_FOREST

# Cross-validation settings
model.crossvalidation.enabled=true
model.crossvalidation.folds=10

# Training parameters
model.training.min-matches=100
model.training.train-split=0.8

# ============================================================================
# Feature Engineering
# ============================================================================
feature.form.window=5

# ============================================================================
# Scheduled Training (Monthly - 1st and 15th at 3 AM)
# Monthly twice as per requirement
# ============================================================================
training.schedule.enabled=true
training.schedule.cron=0 0 3 1,15 * *

# ============================================================================
# API Rate Limiting (to prevent abuse)
# ============================================================================
training.api.rate-limit.enabled=true
training.api.rate-limit.max-requests-per-day=2

# ============================================================================
# Logging
# ============================================================================
logging.config=classpath:logback-spring.xml
logging.level.com.app.modeltraining=INFO

