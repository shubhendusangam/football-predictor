# ============================================
# Docker Profile Configuration
# ============================================

# Use file-based H2 database in container volume
spring.datasource.url=jdbc:h2:file:/app/data/footballdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Model output path in container
model.output.path=/app/data/match_predictor.model

# CSV data paths - copied during Docker build
csv.data.paths=file:/app/data/csv/PL_04_05.csv,file:/app/data/csv/PL_05_06.csv,\
file:/app/data/csv/PL_06_07.csv,file:/app/data/csv/PL_07_08.csv,\
file:/app/data/csv/PL_08_09.csv,file:/app/data/csv/PL_09_10.csv,\
file:/app/data/csv/PL_10_11.csv,file:/app/data/csv/PL_11_12.csv,\
file:/app/data/csv/PL_12_13.csv,file:/app/data/csv/PL_13_14.csv,\
file:/app/data/csv/PL_14_15.csv,file:/app/data/csv/PL_15_16.csv,\
file:/app/data/csv/PL_16_17.csv,file:/app/data/csv/PL_17_18.csv,\
file:/app/data/csv/PL_18_19.csv,file:/app/data/csv/PL_19_20.csv,\
file:/app/data/csv/PL_20_21.csv,file:/app/data/csv/PL_21_22.csv,\
file:/app/data/csv/PL_22_23.csv,file:/app/data/csv/PL_23_24.csv,\
file:/app/data/csv/PL_24_25.csv,file:/app/data/csv/PL_25_26.csv

# Football Data API (set via environment variable FOOTBALL_API_KEY)
football.api.key=${FOOTBALL_API_KEY:}

# Disable H2 console in Docker (security)
spring.h2.console.enabled=false

# Scheduler enabled
scheduler.enabled=true
scheduler.auto-retrain=true

