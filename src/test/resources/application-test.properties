# Test profile configuration
spring.application.name=football-prediction-test

# ?????????????????????????????????????????
#  H2 In-Memory Database (Test)
# ?????????????????????????????????????????
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# ?????????????????????????????????????????
#  CSV File Paths (Test - use same data)
# ?????????????????????????????????????????
csv.data.paths=data/PL_23_24.csv

# ?????????????????????????????????????????
#  Weka Model (Test)
# ?????????????????????????????????????????
model.output.path=./target/test-data/test_model.model

# ?????????????????????????????????????????
#  Feature Engineering
# ?????????????????????????????????????????
feature.form.window=5

# ?????????????????????????????????????????
#  Logging (reduced for tests)
# ?????????????????????????????????????????
logging.level.com.app.footballprediction=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN

